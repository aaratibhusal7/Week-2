<!DOCTYPE html>
<html>
<head>
    <title>My Media Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap"
          rel="stylesheet">
    <link rel="icon" href="images/myphoto.jpg">
    <style>
        h1 {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body>
    <h1>My Media Hub</h1>
    <h2>YouTube Video</h2>
    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video"
        allowfullscreen>
    </iframe>
    <h2>My Local Video</h2>
    <video width="500" controls>
        <source src="videos/video.mp4" type="video/mp4">
        <source src="videos/video.webm" type="video/webm">
        Your browser does not support the video tag.
    </video>
    <h2>My Audio</h2>
    <audio controls>
        <source src="audio/audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <h2>Google Map</h2>
    <iframe
        src="https://www.google.com/maps?q=PCPS+College+Kupondole&output=embed"
        width="600"
        height="450">
    </iframe>
    <h2>External Website</h2>
    <iframe
        src="https://example.com"
        width="600"
        height="400">
    </iframe>
    <h2>PDF Document</h2>
    <embed
        src="files/document.pdf"
        type="application/pdf"
        width="600"
        height="500">
</body>
</html>
